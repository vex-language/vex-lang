name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.cc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install OpenSSL headers for vex:crypto
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  windows:
    name: test (windows-latest, clang)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LLVM_MINGW: llvm-mingw-20261117-ucrt-x86_64
      LLVM_MINGW_SHA256: 4d002e330a0f703625aa5ccbc37e96f8f824413e163bfc7336774aabd2c3a412
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Cache LLVM-MinGW
        id: llvm-mingw
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ env.LLVM_MINGW }}
          key: ${{ env.LLVM_MINGW }}
      - name: Install LLVM-MinGW
        if: steps.llvm-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = "$env:LLVM_MINGW.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/$zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:LLVM_MINGW_SHA256) { throw "checksum mismatch for ${zip}: $hash" }
          & "$env:SystemRoot\System32\tar.exe" -xf $zip
          Remove-Item $zip
      - name: Put clang on the PATH
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW\bin"
          $bin >> $env:GITHUB_PATH
          "CC=$(Join-Path $bin 'clang.exe')" >> $env:GITHUB_ENV
      - name: Build
        run: ./build.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Run 200 random programs with known output
        run: go test -count=1 ./tests -run TestGeneratedPrograms -programs 200
      - name: Run 100 random map programs against a model
        run: go test -count=1 ./tests -run TestMapOperations -maps 100

  sanitizers:
    name: sanitizers (ubuntu, clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      VEX_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_stack_use_after_return=0:detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install OpenSSL headers for vex:crypto
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Test generated programs under ASan and UBSan
        run: go test -count=1 ./compiler/codegen ./tests
      - name: Test async and isolates under TSan
        env:
          VEX_CFLAGS: -fsanitize=thread -g
        run: go test -count=1 -run 'TestExamples/(async|isolates)' ./tests

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz the compiler
        run: go test ./tests -run '^$' -fuzz FuzzCompiler -fuzztime 90s
      - name: Fuzz generated C
        run: go test ./tests -run '^$' -fuzz FuzzGeneratedC -fuzztime 90s

  generated:
    name: generated programs
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run 200 random programs with known output
        run: go test ./tests -run TestGeneratedPrograms -programs 200
      - name: Run 100 random map programs against a model
        run: go test ./tests -run TestMapOperations -maps 100
